                        <body>
                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 Call List Parser</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: #f8f9fa;
    color: #2d3436;
    min-height: 100vh;
    padding: 24px 8px;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    padding: 32px 28px;
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 2rem;
    color: #2d3436;
    margin-bottom: 8px;
}

.header .subtitle {
    color: #888;
    font-size: 0.95rem;
    margin-bottom: 16px;
}

.nav-links {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.nav-links a {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid #0984e3;
    border-radius: 50px;
    color: #0984e3;
    text-decoration: none;
    font-size: 0.9rem;
    background: transparent;
    transition: background 0.2s, color 0.2s;
}

.nav-links a:hover {
    background: #0984e3;
    color: #fff;
}

/* Controls */
.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.controls button {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.2s, transform 0.1s;
}

.controls button:hover {
    opacity: 0.9;
}

.controls button:active {
    transform: scale(0.97);
}

.btn-paste {
    background: #6c5ce7;
    color: white;
}

.btn-upload {
    background: #0984e3;
    color: white;
}

.btn-clear {
    background: #e17055;
    color: white;
}

/* Status Bar */
.status-bar {
    text-align: center;
    margin-bottom: 20px;
    min-height: 24px;
}

.status-msg {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    animation: fadeIn 0.3s;
}

.status-success {
    background: #d4edda;
    color: #155724;
}

.status-error {
    background: #f8d7da;
    color: #721c24;
}

.status-info {
    background: #d1ecf1;
    color: #0c5460;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Session badge & call count */
.result-header {
    text-align: center;
    margin-bottom: 16px;
}

.session-badge {
    display: inline-block;
    background: #fff3cd;
    color: #856404;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    margin-bottom: 6px;
}

.call-count {
    color: #666;
    font-size: 0.95rem;
}

/* Empty State */
.empty-state {
    text-align: center;
    padding: 60px 20px;
}

.empty-state .emoji {
    font-size: 3rem;
    margin-bottom: 12px;
}

.empty-state .msg {
    font-size: 1.2rem;
    color: #888;
    margin-bottom: 8px;
}

.empty-state .hint {
    font-size: 0.9rem;
    color: #adb5bd;
}

/* Cards */
.call-card {
    background: #fff;
    border: 1px solid #dee2e6;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.call-card:hover {
    border-color: #74b9ff;
    box-shadow: 0 0 0 3px rgba(116,185,255,0.15);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 10px;
}

.call-badge {
    background: #e9ecef;
    color: #495057;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 700;
    white-space: nowrap;
}

.card-actions {
    display: flex;
    gap: 8px;
}

.card-actions button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.2s;
    white-space: nowrap;
}

.card-actions button:hover {
    opacity: 0.85;
}

.btn-copy {
    background: #00b894;
    color: white;
}

.btn-copy-open {
    background: #0984e3;
    color: white;
}

.btn-copied {
    background: #f39c12 !important;
    color: white !important;
}

/* Field Grid */
.field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.field {
    padding: 10px 14px;
    background: #f8f9fa;
    border-radius: 8px;
}

.field.full-width {
    grid-column: 1 / -1;
}

.field-label {
    text-transform: uppercase;
    font-size: 0.7rem;
    color: #888;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
}

.field-value {
    font-size: 0.95rem;
    color: #2d3436;
    word-break: break-word;
}

.field-value.na {
    color: #adb5bd;
    font-style: italic;
}

/* Hidden file input */
#fileInput {
    display: none;
}

/* Responsive */
@media (max-width: 600px) {
    .container {
        padding: 18px 10px;
    }

    .controls {
        flex-direction: column;
        align-items: stretch;
    }

    .controls button {
        width: 100%;
    }

    .nav-links {
        flex-direction: column;
        align-items: center;
    }

    .field-grid {
        grid-template-columns: 1fr;
    }

    .field.full-width {
        grid-column: 1;
    }

    .card-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .card-actions {
        width: 100%;
    }

    .card-actions button {
        flex: 1;
    }
}
</style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>📋 Call List Parser</h1>
        <p class="subtitle">Paste HTML from your clipboard or upload an HTML file to extract call information</p>
        <div class="nav-links">
            <a href="https://charleshuff.github.io/POA/call_notes.html" target="_blank" rel="noopener noreferrer">📝 Open Call Notes Page</a>
            <a href="https://charleshuff.github.io/POA/screenshot_keeper.html" target="_blank" rel="noopener noreferrer">📸 Screenshot Keeper</a>
            <a href="https://etms.pacificoffice.com/" target="_blank" rel="noopener noreferrer">🌐 Open ETMS</a>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn-paste" id="btnPaste">📋 Paste from Clipboard</button>
        <button class="btn-upload" id="btnUpload">📁 Upload HTML File</button>
        <button class="btn-clear" id="btnClear">🗑️ Clear All</button>
    </div>
    <input type="file" id="fileInput" accept=".html,.htm">

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar"></div>

    <!-- Result Header -->
    <div class="result-header" id="resultHeader"></div>

    <!-- Call Cards Container -->
    <div id="callCards"></div>
</div>

<script>
(function() {
    'use strict';

    const STORAGE_KEY = 'callParserData';
    const CALL_NOTES_URL = 'https://charleshuff.github.io/POA/call_notes.html';

    let statusTimer = null;

    // --- Utility: Escape HTML to prevent XSS ---
    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // --- Status Messages ---
    function showStatus(message, type) {
        const bar = document.getElementById('statusBar');
        const cls = type === 'success' ? 'status-success' : type === 'error' ? 'status-error' : 'status-info';
        bar.innerHTML = '<span class="status-msg ' + cls + '">' + escapeHTML(message) + '</span>';
        if (statusTimer) clearTimeout(statusTimer);
        statusTimer = setTimeout(function() {
            bar.innerHTML = '';
        }, 5000);
    }

    // --- Parse ETMS HTML ---
    function parseETMS(htmlString) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, 'text/html');

        // Extract technician name (global)
        let techName = 'N/A';
        const settingsPanel = doc.querySelector('#settingsPanel');
        if (settingsPanel) {
            const strong = settingsPanel.querySelector('strong');
            if (strong) {
                const raw = strong.textContent.trim();
                const match = raw.match(/^(.+?)\s*\(/);
                if (match) {
                    techName = match[1].trim();
                } else {
                    techName = raw;
                }
            }
        } else {
            // Fallback: look for <a href="#settingsPanel">
            const fallbackLink = doc.querySelector('a[href="#settingsPanel"]');
            if (fallbackLink) {
                const raw = fallbackLink.textContent.trim();
                const match = raw.match(/^(.+?)\s*\(/);
                if (match) {
                    techName = match[1].trim();
                } else {
                    techName = raw;
                }
            }
        }

        // Extract calls
        const callItems = doc.querySelectorAll('li[data-call-id]');
        const calls = [];

        callItems.forEach(function(li, index) {
            // Title (Customer)
            let title = 'N/A';
            const h3 = li.querySelector('h3');
            if (h3) {
                title = h3.textContent.trim() || 'N/A';
            }

            // Get all <p> elements inside the <li>
            const paragraphs = li.querySelectorAll('p');

            // Contact
            let contact = 'N/A';
            // City
            let city = 'N/A';
            // Item No.(Model), Serial, Equipment
            let itemNo = 'N/A';
            let serial = 'N/A';
            let equipmentId = 'N/A';

            paragraphs.forEach(function(p) {
                const text = p.textContent || '';
                const style = p.getAttribute('style') || '';

                // Check for Item No.(Model) line
                if (text.indexOf('Item No.(Model):') !== -1) {
                    const regex = /Item No\.\(Model\):\s*(.*?)\s*Serial:\s*(.*?)\s*Equipment:\s*(.*)/;
                    const m = text.match(regex);
                    if (m) {
                        itemNo = m[1].trim() || 'N/A';
                        serial = m[2].trim() || 'N/A';
                        equipmentId = m[3].trim() || 'N/A';
                    }
                    return;
                }

                // Check for City (contains | but not "Call Type")
                if (text.indexOf('|') !== -1 && text.indexOf('Call Type') === -1) {
                    const parts = text.split('|');
                    if (parts.length >= 2) {
                        const afterPipe = parts[1].trim();
                        const cityMatch = afterPipe.match(/^([A-Za-z\s.'\-]+),/);
                        if (cityMatch) {
                            city = cityMatch[1].trim();
                        }
                    }
                    return;
                }

                // Check for Contact
                if (style.indexOf('white-space') !== -1 && style.indexOf('normal') !== -1) {
                    // Must contain a <strong> child
                    const strongEl = p.querySelector('strong');
                    if (!strongEl) return;

                    // Must NOT contain these strings
                    if (text.indexOf('|') !== -1) return;
                    if (text.indexOf('Description:') !== -1) return;
                    if (text.indexOf('Equipment Note:') !== -1) return;
                    if (text.indexOf('Hours:') !== -1) return;
                    if (text.indexOf('Item No.(Model):') !== -1) return;

                    const contactText = strongEl.textContent.trim();
                    if (/^[\s\-]+$/.test(contactText)) {
                        contact = 'N/A';
                    } else {
                        contact = contactText || 'N/A';
                    }
                }
            });

            calls.push({
                title: title,
                contact: contact,
                technician: techName,
                city: city,
                itemNo: itemNo,
                serial: serial,
                equipmentId: equipmentId
            });
        });

        return calls;
    }

    // --- Format call for clipboard ---
    function formatCallText(call) {
        return 'Title (Customer): ' + call.title + '\n' +
               'Contact: ' + call.contact + '\n' +
               'Technician: ' + call.technician + '\n' +
               'City: ' + call.city + '\n' +
               'Item No. (Model): ' + call.itemNo + '\n' +
               'Serial Number: ' + call.serial + '\n' +
               'Equipment ID: ' + call.equipmentId;
    }

    // --- Render call cards ---
    function renderCalls(calls, restored) {
        const container = document.getElementById('callCards');
        const header = document.getElementById('resultHeader');

        container.innerHTML = '';
        header.innerHTML = '';

        if (calls.length === 0) {
            container.innerHTML =
                '<div class="empty-state">' +
                    '<div class="emoji">⚠️</div>' +
                    '<div class="msg">No calls found in the HTML</div>' +
                    '<div class="hint">Expected &lt;li data-call-id="..."&gt; elements in the source HTML</div>' +
                '</div>';
            return;
        }

        let headerHTML = '';
        if (restored) {
            headerHTML += '<div class="session-badge">♻️ Restored from session</div><br>';
        }
        headerHTML += '<span class="call-count">' + calls.length + ' call' + (calls.length !== 1 ? 's' : '') + ' loaded</span>';
        header.innerHTML = headerHTML;

        calls.forEach(function(call, i) {
            const num = i + 1;
            const card = document.createElement('div');
            card.className = 'call-card';

            function fieldHTML(label, value, fullWidth) {
                const isNA = value === 'N/A';
                return '<div class="field' + (fullWidth ? ' full-width' : '') + '">' +
                    '<div class="field-label">' + escapeHTML(label) + '</div>' +
                    '<div class="field-value' + (isNA ? ' na' : '') + '">' + escapeHTML(value) + '</div>' +
                '</div>';
            }

            card.innerHTML =
                '<div class="card-header">' +
                    '<span class="call-badge">Call #' + num + '</span>' +
                    '<div class="card-actions">' +
                        '<button class="btn-copy" data-index="' + i + '">📋 Copy to Clipboard</button>' +
                        '<button class="btn-copy-open" data-index="' + i + '">🔗 Copy &amp; Open Call Notes</button>' +
                    '</div>' +
                '</div>' +
                '<div class="field-grid">' +
                    fieldHTML('Title (Customer)', call.title, true) +
                    fieldHTML('Contact', call.contact, false) +
                    fieldHTML('Technician', call.technician, false) +
                    fieldHTML('City', call.city, false) +
                    fieldHTML('Item No. (Model)', call.itemNo, false) +
                    fieldHTML('Serial Number', call.serial, false) +
                    fieldHTML('Equipment ID', call.equipmentId, false) +
                '</div>';

            container.appendChild(card);
        });

        // Attach copy handlers
        container.querySelectorAll('.btn-copy').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var idx = parseInt(btn.getAttribute('data-index'), 10);
                var text = formatCallText(calls[idx]);
                try {
                    navigator.clipboard.writeText(text).then(function() {
                        btn.textContent = '✅ Copied!';
                        btn.classList.add('btn-copied');
                        setTimeout(function() {
                            btn.textContent = '📋 Copy to Clipboard';
                            btn.classList.remove('btn-copied');
                        }, 2000);
                    }).catch(function() {
                        showStatus('Failed to copy to clipboard', 'error');
                    });
                } catch (e) {
                    showStatus('Clipboard API not available', 'error');
                }
            });
        });

        container.querySelectorAll('.btn-copy-open').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var idx = parseInt(btn.getAttribute('data-index'), 10);
                var text = formatCallText(calls[idx]);
                try {
                    navigator.clipboard.writeText(text).then(function() {
                        btn.textContent = '✅ Copied! Opening...';
                        btn.classList.add('btn-copied');
                        window.open(CALL_NOTES_URL, '_blank', 'noopener,noreferrer');
                        setTimeout(function() {
                            btn.innerHTML = '🔗 Copy &amp; Open Call Notes';
                            btn.classList.remove('btn-copied');
                        }, 2000);
                    }).catch(function() {
                        showStatus('Failed to copy to clipboard', 'error');
                    });
                } catch (e) {
                    showStatus('Clipboard API not available', 'error');
                }
            });
        });
    }

    // --- Show empty state ---
    function showEmpty() {
        const container = document.getElementById('callCards');
        const header = document.getElementById('resultHeader');
        header.innerHTML = '';
        container.innerHTML =
            '<div class="empty-state">' +
                '<div class="emoji">📞</div>' +
                '<div class="msg">No calls loaded yet</div>' +
                '<div class="hint">Click \'Paste from Clipboard\' or \'Upload HTML File\' to get started</div>' +
            '</div>';
    }

    // --- Session Storage ---
    function saveCalls(calls) {
        try {
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify(calls));
        } catch (e) {
            // silently fail
        }
    }

    function loadCalls() {
        try {
            const data = sessionStorage.getItem(STORAGE_KEY);
            if (data) {
                return JSON.parse(data);
            }
        } catch (e) {
            // silently fail
        }
        return null;
    }

    function clearCalls() {
        try {
            sessionStorage.removeItem(STORAGE_KEY);
        } catch (e) {
            // silently fail
        }
    }

    // --- Handle parsed HTML ---
    function handleParsedHTML(htmlString, source) {
        var calls = parseETMS(htmlString);
        saveCalls(calls);
        renderCalls(calls, false);
        if (calls.length > 0) {
            showStatus('✅ Successfully parsed ' + calls.length + ' call' + (calls.length !== 1 ? 's' : '') + ' from ' + source, 'success');
        } else {
            showStatus('⚠️ No calls found in the provided HTML', 'error');
        }
    }

    // --- Event Listeners ---

    // Paste from Clipboard
    document.getElementById('btnPaste').addEventListener('click', function() {
        try {
            navigator.clipboard.readText().then(function(text) {
                if (!text || text.trim() === '') {
                    showStatus('Clipboard is empty', 'error');
                    return;
                }
                handleParsedHTML(text, 'clipboard');
            }).catch(function(err) {
                showStatus('Failed to read clipboard: ' + err.message, 'error');
            });
        } catch (e) {
            showStatus('Clipboard API not available. Try uploading a file instead.', 'error');
        }
    });

    // Upload HTML File
    document.getElementById('btnUpload').addEventListener('click', function() {
        document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            handleParsedHTML(ev.target.result, 'file upload');
        };
        reader.onerror = function() {
            showStatus('Failed to read the file', 'error');
        };
        reader.readAsText(file);
        // Reset so same file can be re-uploaded
        e.target.value = '';
    });

    // Clear All
    document.getElementById('btnClear').addEventListener('click', function() {
        clearCalls();
        showEmpty();
        showStatus('🗑️ All data cleared', 'info');
    });

    // --- Init: Check session storage ---
    var saved = loadCalls();
    if (saved && saved.length > 0) {
        renderCalls(saved, true);
        showStatus('♻️ Restored ' + saved.length + ' call' + (saved.length !== 1 ? 's' : '') + ' from session', 'info');
    } else {
        showEmpty();
    }

})();
</script>
</body>
</html>
