                            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call List Parser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #00d4ff;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-paste {
            background-color: #00d4ff;
            color: #1a1a2e;
        }

        .btn-paste:hover {
            background-color: #33ddff;
        }

        .btn-file {
            background-color: #6c5ce7;
            color: #fff;
        }

        .btn-file:hover {
            background-color: #7f71ea;
        }

        .btn-clear {
            background-color: #e74c3c;
            color: #fff;
        }

        .btn-clear:hover {
            background-color: #ec6b5e;
        }

        .btn-copy {
            background-color: #2ecc71;
            color: #1a1a2e;
            padding: 8px 18px;
            font-size: 0.85em;
            border-radius: 6px;
        }

        .btn-copy:hover {
            background-color: #4cd787;
        }

        .btn-copy.copied {
            background-color: #f39c12;
            color: #fff;
        }

        #file-input {
            display: none;
        }

        .status-bar {
            text-align: center;
            margin-bottom: 20px;
            min-height: 24px;
        }

        .status-bar .message {
            padding: 8px 20px;
            border-radius: 6px;
            display: inline-block;
            font-size: 0.9em;
        }

        .status-bar .message.success {
            background-color: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .status-bar .message.error {
            background-color: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .status-bar .message.info {
            background-color: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .calls-count {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #aaa;
        }

        .calls-count span {
            color: #00d4ff;
            font-weight: 700;
        }

        .calls-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .call-card {
            background: linear-gradient(135deg, #16213e, #1a1a3e);
            border: 1px solid #2a2a5a;
            border-radius: 12px;
            padding: 20px 24px;
            transition: border-color 0.2s ease;
        }

        .call-card:hover {
            border-color: #00d4ff55;
        }

        .call-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .call-number {
            background-color: #00d4ff22;
            color: #00d4ff;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .call-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 30px;
        }

        .call-field {
            display: flex;
            flex-direction: column;
        }

        .call-field.full-width {
            grid-column: 1 / -1;
        }

        .field-label {
            font-size: 0.75em;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .field-value {
            font-size: 1em;
            color: #e0e0e0;
            word-break: break-word;
        }

        .field-value.na {
            color: #555;
            font-style: italic;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #555;
        }

        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .empty-state .hint {
            font-size: 0.85em;
            color: #444;
        }

        @media (max-width: 600px) {
            .call-fields {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 280px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <h1>📋 Call List Parser</h1>
    <p class="subtitle">Paste HTML from your clipboard or upload an HTML file to extract call information</p>

    <div class="controls">
        <button class="btn btn-paste" id="paste-btn" onclick="pasteFromClipboard()">
            📋 Paste from Clipboard
        </button>
        <button class="btn btn-file" onclick="document.getElementById('file-input').click()">
            📁 Upload HTML File
        </button>
        <button class="btn btn-clear" onclick="clearAll()">
            🗑️ Clear All
        </button>
        <input type="file" id="file-input" accept=".html,.htm" onchange="handleFileUpload(event)">
    </div>

    <div class="status-bar" id="status-bar"></div>

    <div id="calls-output">
        <div class="empty-state">
            <div class="icon">📞</div>
            <p>No calls loaded yet</p>
            <p class="hint">Click "Paste from Clipboard" or "Upload HTML File" to get started</p>
        </div>
    </div>

    <script>
        /**
         * Parses the HTML content and extracts call data.
         * This mirrors the Python parsing logic that finds <li> elements
         * with a 'data-call-id' attribute and extracts title, contact,
         * item number, serial number, and equipment ID from each one.
         */
        function parseCallsHTML(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');

            // Find all call list items identified by the 'data-call-id' attribute
            const callElements = doc.querySelectorAll('li[data-call-id]');
            const calls = [];

            callElements.forEach((call) => {
                // Extract Title from the h3 tag
                const titleTag = call.querySelector('h3');
                const title = titleTag ? titleTag.textContent.trim() : 'N/A';

                // Extract Contact by finding text matching phone number pattern XXX-XXX-XXXX
                const phoneRegex = /\d{3}-\d{3}-\d{4}/;
                let contact = 'N/A';

                // Walk through all text nodes to find one with a phone number
                const walker = document.createTreeWalker(
                    call,
                    NodeFilter.SHOW_TEXT,
                    null,
                    false
                );

                let textNode;
                while ((textNode = walker.nextNode())) {
                    if (phoneRegex.test(textNode.textContent)) {
                        contact = textNode.textContent.trim();
                        break;
                    }
                }

                // Default values for item info
                let itemModel = 'N/A';
                let serialNumber = 'N/A';
                let equipmentID = 'N/A';

                // Find the paragraph containing "Item No.(Model):"
                const paragraphs = call.querySelectorAll('p');
                for (const p of paragraphs) {
                    const pText = p.textContent.replace(/\s+/g, ' ').trim();
                    if (pText.includes('Item No.(Model):')) {
                        const match = pText.match(
                            /Item No\.\(Model\):\s*(.*?)\s*Serial:\s*(.*?)\s*Equipment:\s*(.*)/
                        );
                        if (match) {
                            itemModel = match[1].trim();
                            serialNumber = match[2].trim();
                            equipmentID = match[3].trim();
                        }
                        break;
                    }
                }

                calls.push({
                    title,
                    contact,
                    itemModel,
                    serialNumber,
                    equipmentID
                });
            });

            return calls;
        }

        /**
         * Renders the parsed calls as styled cards in the output area.
         */
        function renderCalls(calls) {
            const output = document.getElementById('calls-output');

            if (calls.length === 0) {
                output.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <p>No calls found in the HTML</p>
                        <p class="hint">Make sure the HTML contains &lt;li&gt; elements with a <code>data-call-id</code> attribute</p>
                    </div>
                `;
                showStatus('No calls found in the provided HTML.', 'error');
                return;
            }

            let html = `<div class="calls-count">Found <span>${calls.length}</span> call(s)</div>`;
            html += '<div class="calls-container">';

            calls.forEach((call, index) => {
                const naClass = (val) => val === 'N/A' ? 'na' : '';

                html += `
                    <div class="call-card" id="call-${index}">
                        <div class="call-card-header">
                            <span class="call-number">Call #${index + 1}</span>
                            <button class="btn btn-copy" onclick="copyCallToClipboard(${index})" id="copy-btn-${index}">
                                📋 Copy to Clipboard
                            </button>
                        </div>
                        <div class="call-fields">
                            <div class="call-field full-width">
                                <span class="field-label">Title (Customer)</span>
                                <span class="field-value ${naClass(call.title)}">${escapeHtml(call.title)}</span>
                            </div>
                            <div class="call-field">
                                <span class="field-label">Contact</span>
                                <span class="field-value ${naClass(call.contact)}">${escapeHtml(call.contact)}</span>
                            </div>
                            <div class="call-field">
                                <span class="field-label">Item No. (Model)</span>
                                <span class="field-value ${naClass(call.itemModel)}">${escapeHtml(call.itemModel)}</span>
                            </div>
                            <div class="call-field">
                                <span class="field-label">Serial Number</span>
                                <span class="field-value ${naClass(call.serialNumber)}">${escapeHtml(call.serialNumber)}</span>
                            </div>
                            <div class="call-field">
                                <span class="field-label">Equipment ID</span>
                                <span class="field-value ${naClass(call.equipmentID)}">${escapeHtml(call.equipmentID)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            output.innerHTML = html;

            showStatus(`Successfully parsed ${calls.length} call(s).`, 'success');
        }

        /**
         * Stores parsed calls globally so the copy button can access them.
         */
        let parsedCalls = [];

        /**
         * Copies a single call's info to the clipboard in a clean text format.
         */
        async function copyCallToClipboard(index) {
            const call = parsedCalls[index];
            if (!call) return;

            const text = [
                `Title (Customer): ${call.title}`,
                `Contact: ${call.contact}`,
                `Item No. (Model): ${call.itemModel}`,
                `Serial Number: ${call.serialNumber}`,
                `Equipment ID: ${call.equipmentID}`
            ].join('\n');

            try {
                await navigator.clipboard.writeText(text);
                const btn = document.getElementById(`copy-btn-${index}`);
                btn.textContent = '✅ Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 Copy to Clipboard';
                    btn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                showStatus('Failed to copy to clipboard. Check browser permissions.', 'error');
                console.error('Clipboard write failed:', err);
            }
        }

        /**
         * Reads HTML content from the user's clipboard and parses it.
         */
        async function pasteFromClipboard() {
            try {
                const clipboardText = await navigator.clipboard.readText();
                if (!clipboardText || clipboardText.trim().length === 0) {
                    showStatus('Clipboard is empty.', 'error');
                    return;
                }

                parsedCalls = parseCallsHTML(clipboardText);
                renderCalls(parsedCalls);
            } catch (err) {
                showStatus(
                    'Could not read clipboard. Please allow clipboard access or try uploading a file instead.',
                    'error'
                );
                console.error('Clipboard read failed:', err);
            }
        }

        /**
         * Handles file upload and reads the HTML content from the selected file.
         */
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const htmlContent = e.target.result;
                parsedCalls = parseCallsHTML(htmlContent);
                renderCalls(parsedCalls);
            };
            reader.onerror = function () {
                showStatus('Failed to read the file.', 'error');
            };
            reader.readAsText(file);

            // Reset file input so the same file can be re-uploaded
            event.target.value = '';
        }

        /**
         * Clears all parsed results from the page.
         */
        function clearAll() {
            parsedCalls = [];
            document.getElementById('calls-output').innerHTML = `
                <div class="empty-state">
                    <div class="icon">📞</div>
                    <p>No calls loaded yet</p>
                    <p class="hint">Click "Paste from Clipboard" or "Upload HTML File" to get started</p>
                </div>
            `;
            document.getElementById('status-bar').innerHTML = '';
        }

        /**
         * Displays a status message to the user.
         */
        function showStatus(message, type) {
            const statusBar = document.getElementById('status-bar');
            statusBar.innerHTML = `<span class="message ${type}">${escapeHtml(message)}</span>`;
            setTimeout(() => {
                statusBar.innerHTML = '';
            }, 5000);
        }

        /**
         * Escapes HTML to prevent XSS when inserting user-sourced text into the page.
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>

</body>
</html>
